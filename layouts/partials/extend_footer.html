<!-- Mermaid diagram support - load conditionally at runtime -->
<script>
  // Check if page has mermaid diagrams
  if (document.querySelector('.mermaid')) {
    // Dynamically load Mermaid library
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js';
    script.onload = function() {
      mermaid.initialize({
        startOnLoad: true,
        theme: 'base',
        themeVariables: {
          background: 'transparent',
          primaryColor: 'transparent',
          primaryTextColor: 'var(--primary)',
          primaryBorderColor: 'var(--primary)',
          lineColor: 'var(--primary)',
          textColor: 'var(--primary)'
        },
        securityLevel: 'loose'
      });
      // Manually trigger rendering since we loaded after DOM ready
      mermaid.run();
    };
    document.head.appendChild(script);
  }
</script>
